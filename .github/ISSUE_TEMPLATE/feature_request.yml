name: Feature request
description: Suggest something Planar should do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Planar do that it doesn't today?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: The pain point or workflow this unblocks — a concrete example helps.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Rough shape
      description: Optional. How might it look or work? A mockup, an example `planar-graph` block, an API sketch — anything.
